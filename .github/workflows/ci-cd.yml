name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
      - assignment
  pull_request:
    branches:
      - develop
      - assignment

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-assignment-app
  PROJECT_NAME: devops-assignment

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      ecr_image_uri: ${{ steps.build-and-push.outputs.ecr_image_uri }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Backend Tests
      run: pytest backend/
      env:
        TESTING: true
      # Adjust the path to your backend tests if they are not directly under 'backend/'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      run: npm install --prefix frontend

    - name: Run Frontend Tests
      run: npm test --prefix frontend

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image (develop)
      id: build-and-push
      if: github.ref == 'refs/heads/develop'
      run: |
        IMAGE_TAG=$(echo $GITHUB_SHA | cut -c 1-7)
        ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
        ECR_REPO=${{ env.ECR_REPOSITORY }}
        FULL_IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
        docker build -t ${FULL_IMAGE_URI} .
        docker push ${FULL_IMAGE_URI}
        echo "ecr_image_uri=${FULL_IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' || 
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/assignment'
      )

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install AWS CLI (for ECS deployment)
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        sudo apt-get install -y unzip
        unzip awscliv2.zip
        sudo ./aws/install

    - name: ECS Deployment (develop/main)
      run: |
        # Get image URI from the build-and-test job output
        IMAGE_URI=${{ needs.build-and-test.outputs.ecr_image_uri }}
        
        # Define task definition family (should match the one in Terraform)
        TASK_DEFINITION_FAMILY="${{ env.PROJECT_NAME }}-task"
        
        # Get the latest task definition revision
        CURRENT_TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition ${TASK_DEFINITION_FAMILY} --query 'taskDefinition.taskDefinitionArn' --output text)
        
        # Create a new task definition revision with the new image
        NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
          --family ${TASK_DEFINITION_FAMILY} \
          --cli-input-json "$(aws ecs describe-task-definition --task-definition ${CURRENT_TASK_DEF_ARN} --query 'taskDefinition | {family: family, taskRoleArn: taskRoleArn, executionRoleArn: executionRoleArn, networkMode: networkMode, requiresCompatibilities: requiresCompatibilities, cpu: cpu, memory: memory, containerDefinitions: containerDefinitions}' | jq --arg IMAGE_URI "${IMAGE_URI}" '.containerDefinitions[0].image = $IMAGE_URI')" \
          --query 'taskDefinition.taskDefinitionArn' --output text)

        # Update the ECS service to use the new task definition and force a new deployment
        aws ecs update-service \
          --cluster ${{ env.PROJECT_NAME }}-cluster \
          --service ${{ env.PROJECT_NAME }}-service \
          --task-definition ${NEW_TASK_DEF_ARN} \
          --force-new-deployment
        
        echo "Successfully deployed ${IMAGE_URI} to ECS service." 